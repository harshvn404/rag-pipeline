[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harshvn404", email = "harshvn.work@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "openai>=3.57.0",
    "pyjwt>=2.10.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
